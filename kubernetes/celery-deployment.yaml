apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: science-data-kit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: science-data-kit:latest
        imagePullPolicy: IfNotPresent
        command: ["celery", "-A", "science_data_kit.core.tasks.celery_app", "worker", "--loglevel=info"]
        env:
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sdk-secrets
              key: NEO4J_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sdk-secrets
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sdk-secrets
              key: JWT_SECRET
        envFrom:
        - configMapRef:
            name: sdk-config
        volumeMounts:
        - name: sdk-data
          mountPath: /app/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "0.2"
          limits:
            memory: "1Gi"
            cpu: "1"
      volumes:
      - name: sdk-data
        persistentVolumeClaim:
          claimName: sdk-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: science-data-kit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
      - name: celery-beat
        image: science-data-kit:latest
        imagePullPolicy: IfNotPresent
        command: ["celery", "-A", "science_data_kit.core.tasks.celery_app", "beat", "--loglevel=info"]
        env:
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sdk-secrets
              key: NEO4J_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sdk-secrets
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sdk-secrets
              key: JWT_SECRET
        envFrom:
        - configMapRef:
            name: sdk-config
        volumeMounts:
        - name: sdk-data
          mountPath: /app/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "0.1"
          limits:
            memory: "512Mi"
            cpu: "0.5"
      volumes:
      - name: sdk-data
        persistentVolumeClaim:
          claimName: sdk-data-pvc