apiVersion: v1
kind: ConfigMap
metadata:
  name: sdk-config
  namespace: science-data-kit
data:
  NEO4J_HOST: "neo4j-service"
  NEO4J_PORT: "7687"
  NEO4J_USER: "neo4j"
  JUPYTER_ENABLED: "true"
  NEODASH_ENABLED: "true"
  LOG_LEVEL: "INFO"
  ENABLE_CACHE: "true"
  CACHE_TTL: "3600"
  MAX_WORKERS: "4"