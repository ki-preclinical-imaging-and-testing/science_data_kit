<div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title">Preview: {{ file_path }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <div class="preview-container text-center">
            <embed src="/api/files/raw?path={{ file_path }}" type="application/pdf" width="100%" height="600px">
            <p class="mt-3">If the PDF doesn't load, you can <a href="/api/files/download?path={{ file_path }}">download it</a> instead.</p>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <a href="/api/files/download?path={{ file_path }}" class="btn btn-primary">Download</a>
    </div>
</div>
