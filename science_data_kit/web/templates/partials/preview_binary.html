<div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title">Preview: {{ file_path }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <div class="preview-container text-center">
            <div class="alert alert-info">
                <i class="bi bi-file-binary display-4"></i>
                <p class="mt-3">This file cannot be previewed in the browser.</p>
                <p>File type: {{ file_path.split('.')[-1] }}</p>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <a href="/api/files/download?path={{ file_path }}" class="btn btn-primary">Download</a>
    </div>
</div>
