[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "science_data_kit_extensions.dropbox"
version = "0.1.0"
description = "Dropbox extension for Science Data Kit"
readme = "README.md"
authors = [
    {name = "Science Data Kit Team", email = "example@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["science", "data", "dropbox", "file storage", "cloud storage"]
requires-python = ">=3.12"
dependencies = [
    "science_data_kit>=0.1.0",
    "dropbox>=11.36.0",
]

[project.urls]
"Homepage" = "https://github.com/your-username/science_data_kit"
"Bug Tracker" = "https://github.com/your-username/science_data_kit/issues"
"Documentation" = "https://science-data-kit.readthedocs.io/"

[tool.setuptools]
packages = ["science_data_kit_extensions.dropbox"]
