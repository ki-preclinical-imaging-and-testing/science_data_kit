version: '3.8'

services:
  # Neo4j database
  neo4j:
    image: neo4j:4.4
    container_name: sdk-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,n10s.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,n10s.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "MATCH () RETURN count(*) as count"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - sdk-network

  # Science Data Kit web application
  sdk-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdk-app
    ports:
      - "8501:8501"  # Streamlit web interface
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - sdk_data:/app/data
    depends_on:
      - neo4j
    restart: unless-stopped
    networks:
      - sdk-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Jupyter Lab for interactive analysis
  jupyter:
    image: jupyter/datascience-notebook:latest
    container_name: sdk-jupyter
    ports:
      - "8888:8888"  # Jupyter Lab interface
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - jupyter_notebooks:/home/jovyan/work
      - sdk_data:/home/jovyan/data:ro
    command: start-notebook.sh --NotebookApp.token='sdk-token' --NotebookApp.password='' --NotebookApp.allow_origin='*'
    depends_on:
      - neo4j
    restart: unless-stopped
    networks:
      - sdk-network

  # NeoDash for Neo4j dashboard visualization
  neodash:
    image: nielsdejong/neodash:latest
    container_name: sdk-neodash
    ports:
      - "5005:5005"  # NeoDash interface
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j
    restart: unless-stopped
    networks:
      - sdk-network

  # Ollama for LLM capabilities
  ollama:
    image: ollama/ollama:latest
    container_name: sdk-ollama
    ports:
      - "11434:11434"  # Ollama API
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - sdk-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:11434/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Redis for caching and message broker
  redis:
    image: redis:latest
    container_name: sdk-redis
    ports:
      - "6379:6379"  # Redis port
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - sdk-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Celery worker for background tasks
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdk-celery-worker
    command: celery -A science_data_kit.tasks.worker worker --loglevel=info
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - neo4j
      - redis
      - sdk-app
    restart: unless-stopped
    networks:
      - sdk-network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  sdk_data:
  jupyter_notebooks:
  ollama_data:
  redis_data:

networks:
  sdk-network:
    name: sdk-network