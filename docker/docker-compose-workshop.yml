version: '3.8'

services:
  # Neo4j database with pre-loaded sample data
  neo4j:
    image: neo4j:4.4
    container_name: sdk-workshop-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/workshop
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,n10s.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,n10s.*
    volumes:
      - ./workshop/neo4j/data:/data
      - ./workshop/neo4j/logs:/logs
      - ./workshop/neo4j/import:/import
      - ./workshop/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "workshop", "MATCH () RETURN count(*) as count"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Science Data Kit web application with workshop configuration
  sdk-app:
    build:
      context: .
      dockerfile: Dockerfile.workshop
    container_name: sdk-workshop-app
    ports:
      - "8501:8501"  # Streamlit web interface
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=workshop
      - WORKSHOP_MODE=true
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - ./workshop/data:/app/data
      - ./workshop/tutorials:/app/tutorials
    depends_on:
      - neo4j
    restart: unless-stopped

  # Jupyter Lab for interactive tutorials
  jupyter:
    image: jupyter/datascience-notebook:latest
    container_name: sdk-workshop-jupyter
    ports:
      - "8888:8888"  # Jupyter Lab interface
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=workshop
    volumes:
      - ./workshop/notebooks:/home/jovyan/work
      - ./workshop/data:/home/jovyan/data
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password='' --NotebookApp.allow_origin='*'
    depends_on:
      - neo4j
    restart: unless-stopped

  # NeoDash for Neo4j dashboard visualization
  neodash:
    image: nielsdejong/neodash:latest
    container_name: sdk-workshop-neodash
    ports:
      - "5005:5005"  # NeoDash interface
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=workshop
    depends_on:
      - neo4j
    restart: unless-stopped

volumes:
  neo4j_data:
  workshop_data:
  workshop_notebooks:

networks:
  default:
    name: sdk-workshop-network